<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/anga.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Website Moved - Redirecting</title>
    <meta http-equiv="refresh" content="0; url=https://angadbhalla.com" />
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        background-color: #f8f9fa;
        color: #333;
      }
      .redirect-container {
        text-align: center;
        max-width: 600px;
        padding: 2rem;
        background: white;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      }
      .redirect-container h1 {
        color: #dc3545;
        margin-bottom: 1rem;
        font-size: 2rem;
      }
      .redirect-container p {
        margin-bottom: 1.5rem;
        line-height: 1.6;
        font-size: 1.1rem;
      }
      .redirect-container .highlight {
        color: #007bff;
        font-weight: 600;
      }
      .redirect-container a {
        color: #007bff;
        text-decoration: none;
        font-weight: 600;
      }
      .redirect-container a:hover {
        text-decoration: underline;
      }
      .loading {
        margin: 1rem 0;
        color: #6c757d;
        font-style: italic;
      }
    </style>
  </head>
  <body>
    <div class="redirect-container">
      <h1>Website Moved</h1>
      <p>
        This portfolio website has been moved to our new location.
        You will be automatically redirected to <span class="highlight">https://angadbhalla.com</span> in a few seconds.
      </p>
      <p class="loading">If you are not redirected automatically, please click the link below:</p>
      <p><a href="https://angadbhalla.com">https://angadbhalla.com</a></p>
    </div>
  </body>
</html>
